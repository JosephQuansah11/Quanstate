[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quanstate"
version = "1.0.0"
description = "Realtime translation device service: streaming speech, translation and voice"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=12",
  "numpy>=1.26",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
stt = ["faster-whisper>=1.0"]
nllb = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2"]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools]
packages = ["quanstate", "quanstate.engines", "quanstate.learning"]

[tool.setuptools.package-data]
quanstate = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
